name: Security & Test Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, security scan, and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project (with dev dependencies)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Static security analysis (bandit)
        run: bandit -r src/

      - name: Dependency vulnerability scan (pip-audit)
        # pip-audit is used instead of `safety` here: the modern `safety`
        # CLI requires an authenticated Safety CLI/platform account to run
        # `safety check`, which breaks in unauthenticated CI. pip-audit is
        # the actively maintained, no-login alternative (backed by the
        # PyPA and the OSV database) that covers the same requirement.
        run: pip-audit -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ --cov=auditor --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t linux-security-auditor:ci .

      - name: Sanity-check the built image
        run: docker run --rm linux-security-auditor:ci --version
